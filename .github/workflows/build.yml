name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  PRODUCT: "Pedal Steel Glide"
  ARTEFACTS: build/PedalSteelGlide_artefacts/Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-latest }
          - { name: macos,   os: macos-latest }
          - { name: windows, os: windows-latest }

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install Linux deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev libgtk-3-dev

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ matrix.name }}-8.0.6

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # --- packaging -------------------------------------------------------

      - name: Package (macOS - the layout apple-signing/sign-and-notarize.sh expects)
        if: matrix.name == 'macos'
        run: |
          mkdir -p stage/VST3 stage/AU stage/Standalone
          cp -R "$ARTEFACTS/VST3/$PRODUCT.vst3"          stage/VST3/
          cp -R "$ARTEFACTS/AU/$PRODUCT.component"       stage/AU/
          cp -R "$ARTEFACTS/Standalone/$PRODUCT.app"     stage/Standalone/
          cd stage && zip -qyr "../$PRODUCT-${{ steps.v.outputs.version }}-macOS.zip" .

      - name: Package (Linux - zip the plugin + standalone)
        if: matrix.name == 'linux'
        run: |
          mkdir -p "stage/$PRODUCT"
          cp -R "$ARTEFACTS/VST3/$PRODUCT.vst3"        "stage/$PRODUCT/"
          cp    "$ARTEFACTS/Standalone/$PRODUCT"       "stage/$PRODUCT/" || true
          cp    README.md LICENSE                      "stage/$PRODUCT/"
          cd stage && zip -qr "../$PRODUCT-${{ steps.v.outputs.version }}-Linux.zip" "$PRODUCT"

      - name: Package (Windows - Inno Setup installer)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $iscc = "${Env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc packaging\installer.iss
          Get-ChildItem packaging\Output

      # --- upload ---------------------------------------------------------

      - name: Upload macOS zip
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT }}-${{ steps.v.outputs.version }}-macOS
          path: ${{ env.PRODUCT }}-${{ steps.v.outputs.version }}-macOS.zip
          if-no-files-found: error

      - name: Upload Linux zip
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT }}-${{ steps.v.outputs.version }}-Linux
          path: ${{ env.PRODUCT }}-${{ steps.v.outputs.version }}-Linux.zip
          if-no-files-found: error

      - name: Upload Windows installer
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT }}-${{ steps.v.outputs.version }}-Windows
          path: packaging/Output/*.exe
          if-no-files-found: error
